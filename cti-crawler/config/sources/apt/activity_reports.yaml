# Collection only: class is provisional; content review is deferred.
# max_reports: null inherits runtime.default_max_reports.
# For development runs use isolated output/state roots and max_reports: 1.
sources:
  ciscoumbrella_activity:
    adapter: ciscoumbrella_activity
    base_url: https://umbrella.cisco.com
    start_urls:
      - https://umbrella.cisco.com/blog/category/cybersecurity-threat-spotlight
    discovery: http
    content: http
    source_family: activity_reports
    report_class: multistep_attack
    classification_basis: activity_source_unreviewed
    max_reports: null

  zscaler_activity:
    adapter: zscaler
    base_url: https://www.zscaler.com
    start_urls:
      - https://threatlabz.zscaler.com/blogs?tag=Security+Research
    discovery: http
    content: http
    source_family: activity_reports
    report_class: multistep_attack
    classification_basis: activity_source_unreviewed
    max_reports: null

  nccgroup_activity:
