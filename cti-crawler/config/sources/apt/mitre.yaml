sources:
  mitre_attack_groups:
    adapter: mitre_attack
    base_url: https://attack.mitre.org
    start_urls:
      - https://attack.mitre.org/groups/
    discovery: http
    content: http
    source_family: mitre_references
    report_class: explicit_apt
    classification_basis: mitre_group_reference
    # Positive value overrides runtime.default_max_reports; null inherits it.
    max_reports: null
